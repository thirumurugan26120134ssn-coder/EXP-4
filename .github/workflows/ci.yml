name: Linux Health Monitor CI/CD

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  health-monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          chmod +x tests/*.sh

      - name: Create required directories
        run: |
          mkdir -p reports
          mkdir -p logs

      - name: Mark Issue #1 as In Progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 1 \
            --add-label "in-progress" \
            --remove-label "done" \
            --remove-label "blocked"

      - name: Run health monitor
        run: |
          ./scripts/health_monitor.sh

      - name: Run automated tests
        run: |
          ./tests/test_health_monitor.sh

      - name: Mark Issue #1 as Done
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 1 \
            --add-label "done" \
            --remove-label "in-progress" \
            --remove-label "blocked"

          gh issue comment 1 \
            --body "CI/CD pipeline completed successfully. Issue #1 marked as DONE."

      - name: Mark Issue #1 as Blocked
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 1 \
            --add-label "blocked" \
            --remove-label "in-progress" \
            --remove-label "done"

          gh issue comment 1 \
            --body "CI/CD pipeline failed. Issue #1 marked as BLOCKED. Investigation required."

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: reports/health_report.txt
